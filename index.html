    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Automatically recover when an outdated chunk is requested following a fresh deployment
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[Vite] Preload error detected. Reloading to obtain latest build assets...', event);
        window.location.reload();
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? event.message : '';
        if (
          msg.indexOf('Failed to load module script') !== -1 ||
          msg.indexOf('Strict MIME type') !== -1 ||
          msg.indexOf('dynamically imported module') !== -1
        ) {
          var reloadKey = 'mobileshop_stale_chunk_reload';
          var lastReload = sessionStorage.getItem(reloadKey);
          if (!lastReload || Date.now() - Number(lastReload) > 8000) {
            sessionStorage.setItem(reloadKey, String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
